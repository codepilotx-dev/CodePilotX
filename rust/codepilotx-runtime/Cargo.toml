[package]
name = "codepilotx-runtime"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "codepilotx_runtime"
path = "src/lib.rs"

[[bin]]
name = "codepilotx-runtime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
ignore = "0.4"
regex = "1"
similar = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
