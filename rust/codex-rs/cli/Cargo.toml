[package]
name = "codepilotx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "codex"
path = "src/main.rs"

[[bin]]
name = "codepilotx"
path = "src/main.rs"

[lib]
name = "codepilotx_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
codepilotx-app-server = { workspace = true }
codepilotx-app-server-daemon = { workspace = true }
codepilotx-app-server-protocol = { workspace = true }
codepilotx-app-server-test-client = { workspace = true }
codepilotx-arg0 = { workspace = true }
codepilotx-api = { workspace = true }
codepilotx-chatgpt = { workspace = true }
codepilotx-cloud-tasks = { path = "../cloud-tasks" }
codepilotx-utils-cli = { workspace = true }
codepilotx-config = { workspace = true }
codepilotx-core = { workspace = true }
codepilotx-core-plugins = { workspace = true }
codepilotx-home = { workspace = true }
codepilotx-exec = { workspace = true }
codepilotx-exec-server = { workspace = true }
codepilotx-execpolicy = { workspace = true }
codepilotx-features = { workspace = true }
codepilotx-git-utils = { workspace = true }
codepilotx-install-context = { workspace = true }
codepilotx-login = { workspace = true }
codepilotx-memories-write = { workspace = true }
codepilotx-mcp = { workspace = true }
codepilotx-mcp-server = { workspace = true }
codepilotx-model-provider = { workspace = true }
codepilotx-models-manager = { workspace = true }
codepilotx-plugin = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-responses-api-proxy = { workspace = true }
codepilotx-rmcp-client = { workspace = true }
codepilotx-rollout = { workspace = true }
codepilotx-rollout-trace = { workspace = true }
codepilotx-sandboxing = { workspace = true }
codepilotx-state = { workspace = true }
codepilotx-stdio-to-uds = { workspace = true }
codepilotx-terminal-detection = { workspace = true }
codepilotx-tui = { workspace = true }
codepilotx-utils-absolute-path = { workspace = true }
codepilotx-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
codex_windows_sandbox = { package = "codepilotx-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
codepilotx-utils-cargo-bin = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
wiremock = { workspace = true }
