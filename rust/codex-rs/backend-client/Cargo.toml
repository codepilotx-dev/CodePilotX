[package]
name = "codepilotx-backend-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
codepilotx-backend-openapi-models = { path = "../codepilotx-backend-openapi-models" }
codepilotx-api = { workspace = true }
codepilotx-client = { workspace = true }
codepilotx-login = { workspace = true }
codepilotx-model-provider = { workspace = true }
codepilotx-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"
