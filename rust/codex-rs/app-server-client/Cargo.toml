[package]
name = "codepilotx-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codepilotx_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codepilotx-app-server = { workspace = true }
codepilotx-app-server-protocol = { workspace = true }
codepilotx-arg0 = { workspace = true }
codepilotx-config = { workspace = true }
codepilotx-core = { workspace = true }
codepilotx-exec-server = { workspace = true }
codepilotx-feedback = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-uds = { workspace = true }
codepilotx-utils-absolute-path = { workspace = true }
codepilotx-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
