[package]
name = "codepilotx-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codepilotx-mcp-server"
path = "src/main.rs"

[lib]
name = "codepilotx_mcp_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codepilotx-arg0 = { workspace = true }
codepilotx-config = { workspace = true }
codepilotx-core = { workspace = true }
codepilotx-home = { workspace = true }
codepilotx-exec-server = { workspace = true }
codepilotx-extension-api = { workspace = true }
codepilotx-login = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-utils-cli = { workspace = true }
codepilotx-utils-json-to-toml = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
codepilotx-utils-absolute-path = { workspace = true }
codepilotx-shell-command = { workspace = true }
core_test_support = { workspace = true }
mcp_test_support = { workspace = true }
os_info = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
