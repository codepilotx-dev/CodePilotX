codepilotx-keyring-store = { workspace = true }
codepilotx-memories-extension = { workspace = true }
codepilotx-web-search-extension = { workspace = true }
codepilotx-memories-write = { workspace = true }
codepilotx-mcp = { workspace = true }
codepilotx-mcp-extension = { workspace = true }
codepilotx-model-provider = { workspace = true }
codepilotx-models-manager = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-app-server-protocol = { workspace = true }
codepilotx-app-server-transport = { workspace = true }
codepilotx-feedback = { workspace = true }
codepilotx-rmcp-client = { workspace = true }
codepilotx-rollout = { workspace = true }
codepilotx-sandboxing = { workspace = true }
