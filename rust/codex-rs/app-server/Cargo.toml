[package]
name = "codepilotx-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codepilotx-app-server"
path = "src/main.rs"

[[bin]]
name = "codepilotx-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[lib]
name = "codepilotx_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
codepilotx-analytics = { workspace = true }
codepilotx-arg0 = { workspace = true }
codepilotx-cloud-config = { workspace = true }
codepilotx-config = { workspace = true }
codepilotx-core = { workspace = true }
codepilotx-core-plugins = { workspace = true }
codepilotx-home = { workspace = true }
codepilotx-exec-server = { workspace = true }
codepilotx-extension-api = { workspace = true }
codepilotx-external-agent-migration = { workspace = true }
codepilotx-external-agent-sessions = { workspace = true }
codepilotx-features = { workspace = true }
codepilotx-goal-extension = { workspace = true }
codepilotx-guardian = { workspace = true }
codepilotx-git-utils = { workspace = true }
codepilotx-file-watcher = { workspace = true }
codepilotx-hooks = { workspace = true }
codepilotx-otel = { workspace = true }
codepilotx-plugin = { workspace = true }
codepilotx-shell-command = { workspace = true }
codepilotx-skills-extension = { workspace = true }
codepilotx-utils-cli = { workspace = true }
codepilotx-utils-pty = { workspace = true }
codepilotx-backend-client = { workspace = true }
codepilotx-file-search = { workspace = true }
codepilotx-chatgpt = { workspace = true }
codepilotx-login = { workspace = true }
