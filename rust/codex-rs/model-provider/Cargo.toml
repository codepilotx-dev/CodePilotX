[package]
edition.workspace = true
license.workspace = true
name = "codepilotx-model-provider"
version.workspace = true

[lib]
doctest = false
name = "codepilotx_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codepilotx-api = { workspace = true }
codepilotx-agent-identity = { workspace = true }
codepilotx-aws-auth = { workspace = true }
codepilotx-client = { workspace = true }
codepilotx-feedback = { workspace = true }
codepilotx-login = { workspace = true }
codepilotx-model-provider-info = { workspace = true }
codepilotx-models-manager = { workspace = true }
codepilotx-otel = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-response-debug-context = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
