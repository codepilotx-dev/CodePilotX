[package]
edition.workspace = true
license.workspace = true
name = "codepilotx-memories-write"
version.workspace = true

[lib]
name = "codepilotx_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
codepilotx-backend-client = { workspace = true }
codepilotx-core = { workspace = true }
codepilotx-config = { workspace = true }
codepilotx-features = { workspace = true }
codepilotx-git-utils = { workspace = true }
codepilotx-login = { workspace = true }
codepilotx-model-provider = { workspace = true }
codepilotx-otel = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-rollout = { workspace = true }
codepilotx-rollout-trace = { workspace = true }
codepilotx-secrets = { workspace = true }
codepilotx-state = { workspace = true }
codepilotx-terminal-detection = { workspace = true }
codepilotx-utils-absolute-path = { workspace = true }
codepilotx-utils-output-truncation = { workspace = true }
codepilotx-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
codepilotx-model-provider-info = { workspace = true }
codepilotx-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
