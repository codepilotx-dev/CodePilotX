[package]
edition.workspace = true
license.workspace = true
name = "codepilotx-models-manager"
version.workspace = true

[lib]
doctest = false
name = "codepilotx_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
codepilotx-app-server-protocol = { workspace = true }
codepilotx-collaboration-mode-templates = { workspace = true }
codepilotx-login = { workspace = true }
codepilotx-otel = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-utils-output-truncation = { workspace = true }
codepilotx-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
