[package]
edition.workspace = true
license.workspace = true
name = "codepilotx-analytics"
version.workspace = true

[lib]
doctest = false
name = "codepilotx_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codepilotx-app-server-protocol = { workspace = true }
codepilotx-git-utils = { workspace = true }
codepilotx-login = { workspace = true }
codepilotx-model-provider = { workspace = true }
codepilotx-plugin = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-state = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
codepilotx-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
