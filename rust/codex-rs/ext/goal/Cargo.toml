[package]
edition.workspace = true
license.workspace = true
name = "codepilotx-goal-extension"
version.workspace = true

[lib]
name = "codepilotx_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
codepilotx-analytics = { workspace = true }
codepilotx-core = { workspace = true }
codepilotx-extension-api = { workspace = true }
codepilotx-otel = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-state = { workspace = true }
codepilotx-tools = { workspace = true }
codepilotx-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
