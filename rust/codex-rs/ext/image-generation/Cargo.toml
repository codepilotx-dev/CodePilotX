[package]
edition.workspace = true
license.workspace = true
name = "codepilotx-image-generation-extension"
version.workspace = true

[lib]
name = "codepilotx_image_generation_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codepilotx-api = { workspace = true }
codepilotx-core = { workspace = true }
codepilotx-extension-api = { workspace = true }
codepilotx-login = { workspace = true }
codepilotx-model-provider = { workspace = true }
codepilotx-model-provider-info = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-tools = { workspace = true }
codepilotx-utils-absolute-path = { workspace = true }
codepilotx-utils-image = { workspace = true }
codepilotx-utils-path-uri = { workspace = true }
http = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
