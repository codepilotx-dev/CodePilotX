[package]
edition.workspace = true
license.workspace = true
name = "codepilotx-memories-extension"
version.workspace = true

[lib]
name = "codepilotx_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codepilotx-core = { workspace = true }
codepilotx-extension-api = { workspace = true }
codepilotx-features = { workspace = true }
codepilotx-otel = { workspace = true }
codepilotx-tools = { workspace = true }
codepilotx-utils-absolute-path = { workspace = true }
codepilotx-utils-output-truncation = { workspace = true }
codepilotx-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
