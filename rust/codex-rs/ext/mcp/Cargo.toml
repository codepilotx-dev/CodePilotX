[package]
edition.workspace = true
license.workspace = true
name = "codepilotx-mcp-extension"
version.workspace = true

[lib]
name = "codepilotx_mcp_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codepilotx-core = { workspace = true }
codepilotx-core-plugins = { workspace = true }
codepilotx-config = { workspace = true }
codepilotx-exec-server = { workspace = true }
codepilotx-extension-api = { workspace = true }
codepilotx-features = { workspace = true }
codepilotx-mcp = { workspace = true }
codepilotx-plugin = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-utils-absolute-path = { workspace = true }
codepilotx-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
codepilotx-login = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
