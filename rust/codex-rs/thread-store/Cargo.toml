[package]
edition.workspace = true
license.workspace = true
name = "codepilotx-thread-store"
version.workspace = true

[lib]
name = "codepilotx_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
codepilotx-git-utils = { workspace = true }
codepilotx-install-context = { workspace = true }
codepilotx-protocol = { workspace = true }
codepilotx-rollout = { workspace = true }
codepilotx-state = { workspace = true }
codepilotx-utils-path = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
