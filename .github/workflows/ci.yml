name: Security CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-pr-policy:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      trusted: ${{ steps.policy.outputs.trusted }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify trusted Release PR policy
        id: policy
        run: bun scripts/verify-release-pr-policy.ts

  quality:
    needs: release-pr-policy
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        if: needs.release-pr-policy.outputs.trusted != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        if: needs.release-pr-policy.outputs.trusted != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun install --frozen-lockfile
      - name: Version consistency check
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun run version:check
      - name: Typecheck
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun run typecheck
      - name: Renderer CSS policy check
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun run desktop:css:check
      - name: Build agent
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun run build:agent
      - name: Build renderer
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun run build:renderer
      - name: Performance statistics tests
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun run test:performance:stats
      - name: Renderer performance observation
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun scripts/performance/run-suite.ts --suite=renderer
      - name: Upload renderer performance report
        if: always() && needs.release-pr-policy.outputs.trusted != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-performance-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: performance-results/renderer/
          if-no-files-found: warn
          retention-days: 14
      - name: Build desktop
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun run build:desktop
      - name: Whitespace check
        if: needs.release-pr-policy.outputs.trusted != 'true'
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base -or $base -match '^0+$') {
            $base = "HEAD^"
          }
          git diff --check "$base...HEAD"
      - name: Accept verified Release PR receipt
        if: needs.release-pr-policy.outputs.trusted == 'true'
        run: echo "Trusted signed Release PR uses its locked local preflight and environment dry-run receipt."

  unit-tests:
    needs: release-pr-policy
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        if: needs.release-pr-policy.outputs.trusted != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        if: needs.release-pr-policy.outputs.trusted != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun install --frozen-lockfile
      - name: Unit tests
        if: needs.release-pr-policy.outputs.trusted != 'true'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun run test:unit
      - name: Accept verified Release PR receipt
        if: needs.release-pr-policy.outputs.trusted == 'true'
        run: echo "Trusted signed Release PR uses its locked local preflight receipt."

  dependency-audit:
    needs: release-pr-policy
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        if: needs.release-pr-policy.outputs.trusted != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        if: needs.release-pr-policy.outputs.trusted != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun install --frozen-lockfile
      - name: High and critical dependency audit
        if: needs.release-pr-policy.outputs.trusted != 'true'
        run: bun run security:audit
      - name: Accept verified Release PR receipt
        if: needs.release-pr-policy.outputs.trusted == 'true'
        run: echo "Trusted signed Release PR uses its locked local security-audit receipt."
