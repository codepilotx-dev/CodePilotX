name: Release runner canary

run-name: >-
  Release runner canary /
  ${{ github.event_name == 'schedule' && 'daily' || github.event_name }} /
  ${{ github.sha }}

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 独立并发组且不取消进行中的任务，避免隐藏连续环境故障。
  group: release-runner-canary-${{ github.repository }}
  cancel-in-progress: false

jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, codepilotx-release]
    timeout-minutes: 60
    environment:
      name: beta-release
    steps:
      - name: Checkout main committed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create isolated release run context
        id: run-context
        shell: pwsh
        run: |
          bun scripts/release-run-context.ts create
          if ($LASTEXITCODE -ne 0) { throw "Failed to create the isolated release run context" }
          "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows x64 agent
        run: bun run build:agent

      - name: Sign agent with release certificate
        shell: pwsh
        run: |
          bun scripts/sign-win-agent.ts
          if ($LASTEXITCODE -ne 0) { throw "Release certificate signing failed" }

      - name: Verify signed agent runtime
        id: verify
        shell: pwsh
        run: |
          $output = bun scripts/agent-runtime-verifier.ts `
            --agent apps/agent/dist/x64/codepilotx-agent.exe `
            --require-authenticode
          if ($LASTEXITCODE -ne 0) { throw "Signed agent runtime canary failed" }
          function Extract-Timing($name) {
            $match = [regex]::Match($output, '"' + $name + '":\s*(\d+)')
            if (-not $match.Success) { throw "Verifier output is missing $name" }
            return $match.Groups[1].Value
          }
          "readyMs=$(Extract-Timing 'readyMs')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "apiReadyMs=$(Extract-Timing 'apiReadyMs')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "providerCount=$(Extract-Timing 'providerCount')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "modelCount=$(Extract-Timing 'modelCount')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish canary timing summary
        shell: pwsh
        env:
          READY_MS: ${{ steps.verify.outputs.readyMs }}
          API_READY_MS: ${{ steps.verify.outputs.apiReadyMs }}
          PROVIDER_COUNT: ${{ steps.verify.outputs.providerCount }}
          MODEL_COUNT: ${{ steps.verify.outputs.modelCount }}
        run: |
          @(
            "## Release runner canary",
            "",
            "| Metric | Value |",
            "|---|---|",
            "| Agent ready | $env:READY_MS ms |",
            "| /api/ready | $env:API_READY_MS ms |",
            "| Providers | $env:PROVIDER_COUNT |",
            "| Models | $env:MODEL_COUNT |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Dispose release run context
        if: always() && steps.run-context.outputs.created == 'true'
        shell: pwsh
        run: |
          bun scripts/release-run-context.ts dispose
          if ($LASTEXITCODE -ne 0) { throw "Failed to dispose the isolated release run context" }
