name: Finalize beta release

on:
  push:
    branches:
      - main
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Reconcile release state without creating a tag, release, or issue"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: finalize-beta-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      vars.BETA_RELEASE_AUTOMATION_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: [self-hosted, windows, x64, codepilotx-release]
    timeout-minutes: 180
    environment:
      name: beta-release
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Finalize or reconcile beta release
        shell: pwsh
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          BETA_RELEASE_QUIET_MINUTES: ${{ vars.BETA_RELEASE_QUIET_MINUTES || '30' }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $arguments = @(
              "scripts/beta-release.ts",
              "finalize",
              "--main-sha",
              "$env:GITHUB_SHA"
            )
          } else {
            $arguments = @("scripts/beta-release.ts", "reconcile")
          }

          if ($env:RELEASE_DRY_RUN -eq "true") {
            $arguments += "--dry-run"
          }

          & bun @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Beta release finalization or reconciliation failed"
          }
