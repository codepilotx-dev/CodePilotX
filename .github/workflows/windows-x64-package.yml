name: Windows x64 package

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-x64-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-smoke:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build unsigned package
        run: bun run package:win
      - name: Silent install and installed-layout smoke
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/CodePilotX-*-x64.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows x64 installer, found $($installers.Count)"
          }

          $installer = $installers[0].FullName
          $installRoot = Join-Path $PWD "release/installed"
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS silent install failed: $($process.ExitCode)"
          }

          bun scripts/verify-win-x64-package.ts "--unpacked=$installRoot"
          bun scripts/smoke-win-x64.ts "--application=$installRoot/CodePilotX.exe"

  package-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      channel: ${{ steps.release-metadata.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Version policy check
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne "codepilotx-dev/CodePilotX") {
            throw "Release publishing is restricted to codepilotx-dev/CodePilotX"
          }
          bun run version:check -- --tag "$env:GITHUB_REF_NAME"
      - name: Resolve release channel
        id: release-metadata
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -match '^v\d+\.\d+\.\d+-[0-9A-Za-z.-]+$') {
            "channel=prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ($tag -match '^v\d+\.\d+\.\d+$') {
            "channel=stable" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            throw "Unsupported release tag '$tag'. Expected vX.Y.Z-prerelease or vX.Y.Z."
          }
      - name: Build unsigned release package
        run: bun run package:win
      - name: Silent install and installed-layout smoke
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/CodePilotX-*-x64.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows x64 installer, found $($installers.Count)"
          }

          $installer = $installers[0].FullName
          $installRoot = Join-Path $PWD "release/installed"
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS silent install failed: $($process.ExitCode)"
          }

          bun scripts/verify-win-x64-package.ts "--unpacked=$installRoot"
          bun scripts/smoke-win-x64.ts "--application=$installRoot/CodePilotX.exe"
      - name: Generate release notes and SHA-256 checksum
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installers = @(Get-ChildItem release/CodePilotX-*-x64.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows x64 installer, found $($installers.Count)"
          }

          bun scripts/write-release-notes.ts --tag $tag --output release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to generate release notes for $tag"
          }

          $installer = $installers[0]
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$digest *$($installer.Name)" |
            Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release/installed
          format: spdx-json
          output-file: release/codepilotx-windows-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-release-${{ github.ref_name }}
          path: |
            release/CodePilotX-*-x64.exe
            release/SHA256SUMS.txt
            release/codepilotx-windows-x64.spdx.json
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  stable-release-approval:
    needs: package-release
    if: needs.package-release.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: release
    steps:
      - name: Confirm release environment approval
        run: echo "Stable release approved."

  publish-release:
    needs:
      - package-release
      - stable-release-approval
    if: >-
      always() &&
      needs.package-release.result == 'success' &&
      (
        needs.package-release.outputs.channel == 'prerelease' ||
        needs.stable-release-approval.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-release-${{ github.ref_name }}
          path: release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: "${{ github.workspace }}/release/CodePilotX-*-x64.exe"
      - name: Attest SBOM
        uses: actions/attest-sbom@10926c72720ffc3f7b666661c8e55b1344e2a365 # v2
        with:
          subject-path: "${{ github.workspace }}/release/CodePilotX-*-x64.exe"
          sbom-path: "${{ github.workspace }}/release/codepilotx-windows-x64.spdx.json"
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.package-release.outputs.channel }}
        run: |
          $repository = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $notesPath = Join-Path $PWD "release/RELEASE_NOTES.md"
          $lookup = gh api "repos/$repository/releases/tags/$tag" --jq ".draft" 2>&1
          $lookupExitCode = $LASTEXITCODE
          $lookupText = ($lookup | Out-String).Trim()
          if ($lookupExitCode -eq 0) {
            if ($lookupText -ne "true") {
              throw "Release $tag already exists and immutable releases must not be replaced"
            }
            $draftExists = $true
          } elseif ($lookupText -match '\bHTTP 404\b') {
            $draftExists = $false
          } else {
            throw "Unable to determine whether release $tag exists; refusing to publish"
          }

          $assets = @(
            (Get-ChildItem release/CodePilotX-*-x64.exe).FullName
            (Resolve-Path release/SHA256SUMS.txt).Path
            (Resolve-Path release/codepilotx-windows-x64.spdx.json).Path
          )
          if ($assets.Count -ne 3) {
            throw "Expected installer, checksum and SBOM release assets"
          }

          $prereleaseArgs = @()
          if ($env:RELEASE_CHANNEL -eq "prerelease") {
            $prereleaseArgs += "--prerelease"
          }

          if ($draftExists) {
            $prereleaseValue = if ($env:RELEASE_CHANNEL -eq "prerelease") { "true" } else { "false" }
            gh release edit $tag `
              --repo $repository `
              --title "CodePilotX $tag" `
              --notes-file $notesPath `
              --draft=true `
              --prerelease=$prereleaseValue
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to refresh draft GitHub Release $tag"
            }
          } else {
            gh release create $tag `
              --repo $repository `
              --title "CodePilotX $tag" `
              --notes-file $notesPath `
              --draft `
              @prereleaseArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft GitHub Release $tag"
            }
          }

          $draftState = gh api "repos/$repository/releases/tags/$tag" --jq ".draft" 2>&1
          if ($LASTEXITCODE -ne 0 -or ($draftState | Out-String).Trim() -ne "true") {
            throw "Release $tag is not a confirmed draft; refusing to upload assets"
          }

          gh release upload $tag @assets --clobber --repo $repository
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload draft release assets for $tag; the draft was retained for a safe retry"
          }

          $actualAssets = @(gh api "repos/$repository/releases/tags/$tag" --jq ".assets[].name" 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify draft release assets for $tag"
          }
          $expectedAssets = @($assets | ForEach-Object { Split-Path $_ -Leaf })
          $assetDifference = @(Compare-Object $expectedAssets $actualAssets)
          if ($assetDifference.Count -ne 0) {
            throw "Draft release assets for $tag do not exactly match the expected bundle"
          }

          gh release edit $tag --repo $repository --draft=false
          if ($LASTEXITCODE -ne 0) {
            $publishedState = gh api "repos/$repository/releases/tags/$tag" --jq ".draft" 2>&1
            if ($LASTEXITCODE -ne 0 -or ($publishedState | Out-String).Trim() -ne "false") {
              throw "Publishing release $tag returned an ambiguous result; no release was deleted"
            }
          }
